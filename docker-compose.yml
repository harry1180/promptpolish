# PromptPolice — public edge exposure on the shared Traefik proxy
# (/docker/traefik-ffmn, host network, TLS via `letsencrypt`).
#
# Nothing publishes a raw public port. Routing on
# https://governance.agenticalchemy.io (priority order — higher wins):
#
#   61  pp-api     PathPrefix(`/pp/api/`)  → server:8787, stripprefix `/pp`
#   60  pp-web     Path(`/`) | Path(`/index.html`) | PathPrefix(`/assets/`)
#                  | PathPrefix(`/agent-control-tower`) | PathPrefix(`/tradingusa`)
#                  | PathPrefix(`/crypto`)  → web:80
#   50/40  live    the /live transcription sidecar (project `ttv`)
#   30/20  console the cx-trust console (/_next, /api, /console, basic auth)
#   10  cxtrust    catch-all → the cx-trust API
#
# Two things are deliberate:
#  - the SPA owns ONLY `/`, `/index.html` and `/assets/*` — everything else on
#    this host stays with the apps that already claim it;
#  - `/api` is owned by the cx-trust console, so this app's org API is served
#    under `/pp/api/*` (the bundle is built with VITE_API_BASE=/pp and
#    `pp-strip` restores the `/api` prefix before the request reaches
#    apps/server, whose routes are all `/api/...`).

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE: /pp
    labels:
      - traefik.enable=true
      - traefik.http.services.pp-web.loadbalancer.server.port=80
      - traefik.http.routers.pp-web.entrypoints=websecure
      - traefik.http.routers.pp-web.priority=60
      - traefik.http.routers.pp-web.rule=Host(`governance.agenticalchemy.io`) && (Path(`/`) || Path(`/index.html`) || PathPrefix(`/assets/`) || PathPrefix(`/agent-control-tower`) || PathPrefix(`/tradingusa`) || PathPrefix(`/crypto`))
      - traefik.http.routers.pp-web.service=pp-web
      - traefik.http.routers.pp-web.tls.certresolver=letsencrypt
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    # Secrets live OUTSIDE the repo (chmod 600, gitignored patterns) and are
    # injected as container process-env only — never baked into the image,
    # never sent to the browser. Values are read server-side by InferenceRouter.
    env_file:
      - /opt/yard/tradingusa/.env
    # local debugging only (the cx-trust API already owns 127.0.0.1:8787)
    ports:
      - "127.0.0.1:8791:8787"
    environment:
      PORT: "8787"
      PP_DB: /data/promptpolice.db
      # Secure cookies: the public origin is TLS-terminated at Traefik.
      PP_COOKIE_SECURE: "1"
      # Agent Control Tower: demo store is on by default; production requires
      # BOTH server configuration and tenant entitlement (never a UI toggle).
      ACT_DEMO_ENABLED: "1"
      ACT_PROD_ENABLED: "0"
      ACT_PROD_ENTITLED: "0"
      # TradingUSA (paper trading only — ExecutionGuard PAPER_ONLY)
      TU_DB: /data/tradingusa.db
      TU_WORKERS: "1"
      # Crypto spot book (paper only, long-only, 24/7 scheduler)
      CRYPTO_DB: /data/crypto.db
      CRYPTO_WORKERS: "1"
      # Multi-exchange market intelligence (docs/XCHANGE.md) — DATA ONLY:
      # Kraken stays the execution reference; Coinbase is the first additional
      # live source, research-only. Optional venues stay out of the registry.
      CRYPTO_XCHANGE_ENABLED: "1"
      CRYPTO_XCHANGE_VENUES: "coinbase"
      CRYPTO_XCHANGE_CONTEXT: "0"
      # Microstructure Alpha Engine — SHADOW ONLY (docs/CRYPTO-MICRO.md):
      # computes/records micro features from the SAME Kraken WS connection
      # (adds a `trade` subscription on it); decision impact is NONE and
      # SHADOW_MODE stays on. Set to "0" to remove the observer entirely.
      SCALPING_ALPHA_ENABLED: "1"
      SHADOW_MODE: "1"
      LIVE_EXECUTION_ENABLED: "0"
      # Kalshi BTC 15-minute micro-scalping DATA engine (module 1 + 2).
      # Read-only market data: window discovery, order book, trade tape and the
      # BTC spot tape (Coinbase + Kraken via observer hooks — no new sockets).
      # KXBTC15M series fee_type=quadratic => takers pay 0.07*P*(1-P), makers
      # pay nothing; the engine holds no order code at all (paper comes next,
      # behind its own flag). KALSHI_API_KEY_ID + KALSHI_PRIVATE_KEY_PATH come
      # from the env_file below (same read-only Kalshi credential the predict
      # dashboard uses; the key file is mounted read-only at /run/secrets).
      KALSHI15M_ENABLED: "1"
      CRYPTO_SPOT_TAPE: "1"
      # STRATEGIES A..F — SHADOW ONLY: every evaluation (taken or skipped,
      # with its reason) is written to k15m_signals. Nothing here can place an
      # order: the engine has no execution path at all.
      #   A cross-exchange lead/lag   B order-book microstructure
      #   C panic fade                 D momentum scalping
      #   E late-window favorites      F passive maker (fee-free series)
      # Assumptions each one states in its reasons: C rebound fraction 0.5,
      # D continuation 0.5, E/HOLD exit-free, F queue/fill/adverse-selection
      # UNMODELLED. Promote to paper only on evidence from this log.
      KALSHI15M_STRAT_A: "1"
      KALSHI15M_STRAT_B: "1"
      KALSHI15M_STRAT_C: "1"
      KALSHI15M_STRAT_D: "1"
      KALSHI15M_STRAT_E: "1"
      KALSHI15M_STRAT_F: "1"
      # Kraken tier-1 taker fee. Backtest (scripts/crypto-backtest.mts, 602d):
      # 0.25% default -> net -$2.6k; real 0.16% -> +$141 on identical rules.
      CRYPTO_FEE_PCT: "0.0016"
      # Exit geometry = APPROVED GEOMETRY C (horizon-matched sigma_H):
      # stop = 1.0*sigma_H below, target = 2.0*sigma_H above, sigma_H =
      # ATR/price*sqrt(expectedHold). Walk-forward holdout 59% win / +$15,813
      # (44 trades) vs 23% / +$840 at the old tight stop that stopped every
      # closed trade intraday. Positions size down at the same 0.75% risk cap
      # because each stop is now ~1 vol instead of ~0.25 ATR.
      # Rollback = set this back to "atr3" (or "sr") and rebuild.
      CRYPTO_TARGET_MODE: "sigmah"
      # Fusion weights over the six ScoreParts. Crypto fills only technical and
      # regime (fundamental/event/sentiment/macro are hard 0 in v1), so the
      # SHORT defaults leave 46% of the vote on dead parts and their conflict
      # rule turned technical >= +0.5 in a bear regime into
      # CONFLICTING_SIGNAL — 1,186 coin-days inside the 368-day BUY drought
      # (scripts/crypto-blockers.mts), incl. 6 of 25 coins today. Backtest
      # prod_wts: 204 fills / net +$3.9k over 604d vs 183 / +$3.9k defaults.
      CRYPTO_FUSION_WEIGHTS: '{"technical": 0.84, "regime": 0.16}'
      # Conviction floor on fused BUY confidence. At 0.70 a BUY is
      # UNREACHABLE while the strategy layer returns WATCH — fused conf =
      # hint 0.60 x (0.7+0.3*0.52) = 0.514 max — and the BTC regime veto
      # forces WATCH all through a bear tape (368 consecutive days, zero
      # BUY since 2025-11-02). 0.50 lets through setups that already passed
      # fusion (weighted >= 0.30, hint >= 0.55), the sane R:R gate and risk
      # sizing: backtest over 604d = 498 fills / 23.1% win / net +$840 /
      # maxDD 17.0% vs 183 fills / 26.2% / +$3,925 / 14.5% at 0.70 — three
      # times the activity for a thinner edge, and >=10 closed outcomes
      # finally lets MIN_TRADES refit the fusion weights.
      CRYPTO_MIN_SIGNAL_CONFIDENCE: "0.5"
      PILOT_MODE: "true"
      # Model IDs discovered live from each provider's /models endpoint
      # (retired IDs return 404; override here without touching code):
      TU_GROQ_MODEL: "openai/gpt-oss-120b"
      TU_GEMINI_MODEL: "gemini-2.5-flash"
    # Kalshi Ed25519 key: host file is 640 root:predict and the container runs
    # as `node`, so it gets the predict group (982) instead of the file being
    # chmod'ed — no host credential changes, read-only mount, never in the image.
    group_add:
      - "982"
    volumes:
      # SQLite db + auto-generated PP master key (provider keys at rest)
      - pp-data:/data
      - /opt/yard/predict_app/sec/kal.key:/run/secrets/kalshi.key:ro
    labels:
      - traefik.enable=true
      - traefik.http.services.pp-api.loadbalancer.server.port=8787
      - traefik.http.middlewares.pp-strip.stripprefix.prefixes=/pp
      - traefik.http.routers.pp-api.entrypoints=websecure
      - traefik.http.routers.pp-api.priority=61
      - traefik.http.routers.pp-api.rule=Host(`governance.agenticalchemy.io`) && PathPrefix(`/pp/api/`)
      - traefik.http.routers.pp-api.middlewares=pp-strip
      - traefik.http.routers.pp-api.service=pp-api
      - traefik.http.routers.pp-api.tls.certresolver=letsencrypt
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 2s
      retries: 3
    restart: unless-stopped

volumes:
  pp-data: