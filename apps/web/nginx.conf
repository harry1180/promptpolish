# Static shell for the PromptPolice SPA.
# Traefik only routes the SPA's own paths here (`/`, `/index.html`,
# `/assets/*`, `/agent-control-tower*`, `/tradingusa*`, `/crypto*`) — every
# other path on this host belongs to another app — so no catch-all rewrite
# can leak into their territory. The `location /` fallback below is what makes
# deep links like /crypto/learning load the shell.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # hashed build output: immutable
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = / {
    try_files /index.html =404;
  }

  location / {
    try_files $uri /index.html;
  }
}